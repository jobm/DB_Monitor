[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "db-monitor"
version = "0.1.0"
description = "Framework-first CDC monitoring platform and audit-log service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "DB Monitor maintainers" },
]
keywords = [
  "cdc",
  "debezium",
  "fastapi",
  "kafka",
  "observability",
  "postgres",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "aiokafka>=0.13.0",
  "aio-pika>=9.5.7",
  "argon2-cffi>=25.1.0",
  "asyncpg==0.29.0",
  "confluent-kafka>=2.13.2",
  "fastapi>=0.135.1",
  "opentelemetry-api>=1.36.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0",
  "opentelemetry-instrumentation-fastapi>=0.57b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
  "opentelemetry-sdk>=1.36.0",
  "prometheus-client>=0.24.1",
  "PyJWT>=2.10.1",
  "python-dotenv>=1.2.2",
  "sqlalchemy[asyncio]==2.0.25",
  "uvicorn[standard]>=0.41.0",
]

[project.urls]
Homepage = "https://github.com/jobm/DB_Monitor"
Documentation = "https://github.com/jobm/DB_Monitor#readme"
Repository = "https://github.com/jobm/DB_Monitor"
Issues = "https://github.com/jobm/DB_Monitor/issues"

[project.scripts]
db-monitor = "db_monitor.cli:main"
db-monitor-serve = "db_monitor.cli:serve"
db-monitor-migrate = "db_monitor.cli:migrate"

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=9.0.0",
  "ruff>=0.6.0",
]

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "pytest>=9.0.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/db_monitor"]

[tool.hatch.build.targets.sdist]
include = [
  "src/db_monitor",
  "README.md",
  "LICENSE",
]
