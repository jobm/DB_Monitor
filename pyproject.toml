[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "db-monitor"
version = "0.1.0"
description = "Framework-first CDC monitoring platform and audit-log service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "DB Monitor maintainers" },
]
keywords = [
  "cdc",
  "debezium",
  "fastapi",
  "kafka",
  "observability",
  "postgres",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jobm/DB_Monitor"
Documentation = "https://github.com/jobm/DB_Monitor#readme"
Repository = "https://github.com/jobm/DB_Monitor"
Issues = "https://github.com/jobm/DB_Monitor/issues"

[project.scripts]
db-monitor = "db_monitor.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=9.0.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/db_monitor"]

[tool.hatch.build.targets.sdist]
include = [
  "src/db_monitor",
  "README.md",
  "LICENSE",
]
