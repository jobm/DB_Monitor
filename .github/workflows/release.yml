name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-tag:
    name: Verify Signed Tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify signed annotated tag
        run: python scripts/verify_signed_tag.py "${GITHUB_REF_NAME}"

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: verify-tag

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install build dependencies
        run: uv sync --group dev --frozen

      - name: Build wheel and sdist
        run: uv run --group dev python -m build

      - name: Generate artifact checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*

      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl

      - name: Attest sdist provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-artifacts

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Create release with autogenerated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  publish-pypi:
    name: Publish To PyPI
    runs-on: ubuntu-latest
    needs: build-artifacts

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
