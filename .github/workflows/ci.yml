name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install app dependencies
        working-directory: app
        run: uv sync --group dev --frozen

      - name: Run unit tests
        working-directory: app
        run: uv run --group dev python -m pytest ../tests/

  live-integration:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install app dependencies
        working-directory: app
        run: uv sync --group dev --frozen

      - name: Start infrastructure services
        run: |
          docker compose up -d \
            zookeeper \
            kafka \
            postgres-monitor \
            postgres-order \
            postgres-catalog \
            postgres-shipping \
            connect \
            connector-registrar

      - name: Wait for infrastructure readiness
        run: |
          python - <<'PY'
          import socket
          import time
          import urllib.request

          def wait_for_http(url: str, timeout: int = 180) -> None:
              deadline = time.time() + timeout
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=5):
                          return
                  except Exception:
                      time.sleep(2)
              raise SystemExit(f"Timed out waiting for {url}")

          def wait_for_port(
            host: str,
            port: int,
            timeout: int = 180,
          ) -> None:
            deadline = time.time() + timeout
            while time.time() < deadline:
              try:
                with socket.create_connection((host, port), timeout=5):
                  return
              except OSError:
                time.sleep(2)
            raise SystemExit(
              f"Timed out waiting for {host}:{port}"
            )

          wait_for_port("localhost", 5437)
          wait_for_port("localhost", 9093)
          wait_for_http("http://localhost:8083/connectors")
          PY
          docker compose ps

      - name: Start app locally against live infrastructure
        working-directory: app
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5437/postgres
          KAFKA_BROKER: localhost:9093
        run: |
          nohup uv run python start_monitor.py > ../app-integration.log 2>&1 &
          echo $! > ../app-integration.pid

      - name: Wait for app readiness
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://localhost:8000/readyz"
          deadline = time.time() + 180
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      if response.status == 200:
                          print(response.read().decode())
                          raise SystemExit(0)
              except Exception:
                  time.sleep(2)
          raise SystemExit(f"Timed out waiting for {url}")
          PY

      - name: Run live integration suite
        working-directory: app
        run: uv run python ../scripts/run_integration_tests.py

      - name: Seed smoke-load admin key
        working-directory: app
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5437/postgres
        run: |
          smoke_key="$(uv run python ../scripts/seed_admin_api_key.py --owner-name ci-smoke)"
          echo "DB_MONITOR_ADMIN_API_KEY=$smoke_key" >> "$GITHUB_ENV"

      - name: Run smoke-load gate
        working-directory: app
        env:
          DB_MONITOR_ADMIN_API_KEY: ${{ env.DB_MONITOR_ADMIN_API_KEY }}
        run: |
          uv run python ../scripts/load_test.py \
            --workers 8 \
            --requests 10 \
            --targets events,stats,tables,checkpoints \
            --max-failures 0 \
            --min-success-rate 1.0 \
            --max-p95-ms 2000

      - name: Show app log on failure
        if: failure()
        run: |
          test -f app-integration.log && cat app-integration.log || true

      - name: Show compose status on failure
        if: failure()
        run: docker compose ps

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop local app
        if: always()
        run: |
          if [ -f app-integration.pid ]; then
            kill "$(cat app-integration.pid)" || true
          fi

      - name: Tear down infrastructure
        if: always()
        run: docker compose down -v