name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  core-platform-tests:
    name: Core Platform Verification (Unit & Mock Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install app dependencies
        working-directory: app
        run: uv sync --group dev --frozen

      - name: Run unit tests
        run: make monitor-test-core

  sandbox-integration-tests:
    name: Example Sandbox Ingestion & Live Integration
    runs-on: ubuntu-latest
    needs: core-platform-tests
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install app dependencies
        working-directory: app
        run: uv sync --group dev --frozen

      - name: Start sandbox and core services
        run: docker compose --profile sandbox up -d

      - name: Wait for databases and brokers to boot
        run: |
          echo "Waiting for PostgreSQL core monitor and sandbox databases to accept queries..."
          until docker compose exec -T postgres-monitor pg_isready -U postgres -d postgres >/dev/null 2>&1; do
            echo "Waiting for postgres-monitor..."
            sleep 2
          done
          until docker compose exec -T postgres-order pg_isready -U postgres -d postgres >/dev/null 2>&1; do
            echo "Waiting for postgres-order..."
            sleep 2
          done
          until docker compose exec -T postgres-catalog pg_isready -U postgres -d postgres >/dev/null 2>&1; do
            echo "Waiting for postgres-catalog..."
            sleep 2
          done
          until docker compose exec -T postgres-shipping pg_isready -U postgres -d postgres >/dev/null 2>&1; do
            echo "Waiting for postgres-shipping..."
            sleep 2
          done
          echo "All core and sandbox databases are fully operational."

          python - <<'PY'
          import socket
          import time
          import urllib.request

          def wait_for_http(url: str, timeout: int = 180) -> None:
              deadline = time.time() + timeout
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=5):
                          return
                  except Exception:
                      time.sleep(2)
              raise SystemExit(f"Timed out waiting for {url}")

          def wait_for_port(
            host: str,
            port: int,
            timeout: int = 180,
          ) -> None:
            deadline = time.time() + timeout
            while time.time() < deadline:
              try:
                with socket.create_connection((host, port), timeout=5):
                  return
              except OSError:
                time.sleep(2)
            raise SystemExit(
              f"Timed out waiting for {host}:{port}"
            )

          wait_for_port("localhost", 9093)
          wait_for_http("http://localhost:8083/connectors")
          PY
          docker compose ps

      - name: Start app locally against live infrastructure
        working-directory: app
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5437/postgres
          KAFKA_BROKER: localhost:9093
        run: |
          nohup PYTHONPATH=../src:. uv run python -m db_monitor.start_monitor > ../app-integration.log 2>&1 &
          echo $! > ../app-integration.pid

      - name: Wait for app readiness
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://localhost:8000/readyz"
          deadline = time.time() + 180
          print(f"Checking app readiness at {url}")
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=5) as response:
                      if response.status == 200:
                          print("SUCCESS: DB Monitor is fully initialized and operational!")
                          print(response.read().decode())
                          raise SystemExit(0)
                      else:
                          print(f"STILL WAITING: HTTP status code {response.status}")
              except Exception as exc:
                  print(f"STILL WAITING: Port/HTTP check failed with: {exc}")
              time.sleep(2)
          raise SystemExit(f"TIMED OUT waiting for {url}")
          PY

      - name: Seed sandbox admin key
        working-directory: app
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5437/postgres
        run: |
          sandbox_key="$(uv run python ../scripts/seed_admin_api_key.py --owner-name ci-sandbox)"
          echo "DB_MONITOR_ADMIN_API_KEY=$sandbox_key" >> "$GITHUB_ENV"

      - name: Run sandbox pytest checks
        env:
          DB_MONITOR_ADMIN_API_KEY: ${{ env.DB_MONITOR_ADMIN_API_KEY }}
        run: make monitor-test-sandbox-pytest

      - name: Run live integration suite
        env:
          DB_MONITOR_ADMIN_API_KEY: ${{ env.DB_MONITOR_ADMIN_API_KEY }}
        run: make monitor-test-integration

      - name: Run smoke-load gate
        env:
          DB_MONITOR_ADMIN_API_KEY: ${{ env.DB_MONITOR_ADMIN_API_KEY }}
        run: make monitor-test-smoke

      - name: Show app log on failure
        if: failure()
        run: |
          test -f app-integration.log && cat app-integration.log || true

      - name: Show compose status on failure
        if: failure()
        run: docker compose ps

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop local app
        if: always()
        run: |
          if [ -f app-integration.pid ]; then
            kill "$(cat app-integration.pid)" || true
          fi

      - name: Tear down infrastructure
        if: always()
        run: docker compose down -v