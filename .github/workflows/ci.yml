name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python pin ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Ruff lint
        run: uv run --group dev python -m ruff check src/db_monitor tests

      - name: mypy typecheck
        run: uv run --group dev python -m mypy

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python pin ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Build docs (strict)
        run: uv run --group dev mkdocs build --strict

  monitoring:
    name: Prometheus config and rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate scrape config and alert rules
        run: |
          docker run --rm \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            docker.io/prom/prometheus:v2.53.0 \
            check config /etc/prometheus/prometheus.yml

  helm:
    name: Helm chart lint and render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.1

      - name: Lint chart
        run: helm lint --strict deploy/helm/db-monitor

      - name: Render with default values
        run: |
          helm template db-monitor deploy/helm/db-monitor \
            > "$RUNNER_TEMP/rendered-default.yaml"

      - name: Render with optional manifests enabled
        run: |
          helm template db-monitor deploy/helm/db-monitor \
            --set networkPolicy.enabled=true \
            --set monitoring.serviceMonitor.enabled=true \
            --set kafka.topicPartitionCount=6 \
            --set 'kafka.topicNames[0]=orderdb.public.orders' \
            > "$RUNNER_TEMP/rendered-full.yaml"

      - name: Check optional manifests rendered
        run: |
          for kind in NetworkPolicy ServiceMonitor Job; do
            grep -q "^kind: ${kind}$" "$RUNNER_TEMP/rendered-full.yaml" \
              || { echo "::error::${kind} missing from rendered chart"; exit 1; }
          done

  test-core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9093:9093

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python pin ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run core tests
        run: uv run --group dev python -m pytest -m core tests/ -v --tb=short
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5437/postgres
          KAFKA_BROKER: kafka:9092
          JWT_SECRET: ci-test-secret-thats-long-enough-1234
          ALLOW_BOOTSTRAP: "true"

  test-integration:
    name: Integration tests (Kafka + Postgres via service containers)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9093:9093

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python pin ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run slow (integration) tests
        run: uv run --group dev python -m pytest -m slow tests/ -v --tb=short
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9093
