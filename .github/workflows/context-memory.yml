name: Context memory

# Only the context-memory files can affect these checks, so the workflow is
# path-filtered rather than added to ci.yml (which runs on every PR).
on:
  push:
    branches: [main]
    paths:
      - ".goosemem"
      - ".goosehints"
      - "GOOSE_CONTEXT_STRATEGY.md"
      - "scripts/verify_goosemem_retrieval.py"
      - "scripts/validate_goosemem_coverage.sh"
      - "scripts/validate_goosemem_coverage.py"
  pull_request:
    branches: [main]
    paths:
      - ".goosemem"
      - ".goosehints"
      - "GOOSE_CONTEXT_STRATEGY.md"
      - "scripts/verify_goosemem_retrieval.py"
      - "scripts/validate_goosemem_coverage.sh"
      - "scripts/validate_goosemem_coverage.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify .goosemem structure, grounding and retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Structure, path grounding and retrieval
        run: python scripts/verify_goosemem_retrieval.py -v

      - name: Module coverage under src/db_monitor
        run: bash scripts/validate_goosemem_coverage.sh
