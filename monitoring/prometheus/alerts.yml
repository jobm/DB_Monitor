          description: "Ingestion availability for the large cohort (target 99.0%, error budget 1.0%) is consuming more than 14.4x its budget over the last hour. At this rate the 30-day budget is spent in about 50 hours. Break down db_monitor_events_failed_total by service and check broker health and the consumer circuit breaker."
      - alert: IngestionAvailabilityBudgetBurnSlow
        expr: |
          (1 - db_monitor:sli_ingestion_success:ratio_6h{cohort="large"}) / 0.01 > 6
