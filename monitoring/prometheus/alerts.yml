      - alert: FreshnessBudgetBurnFast
        expr: |
          (1 - avg_over_time((db_monitor:consumer_staleness_seconds{cohort="large"} <= bool 600)[1h:1m])) / 0.01 > 14.4
          and
          (1 - avg_over_time((db_monitor:consumer_staleness_seconds{cohort="large"} <= bool 600)[5m:1m])) / 0.01 > 14.4
        for: 2m
        labels:
