apiVersion: v1
kind: Secret
metadata:
  name: {{ include "db-monitor.fullname" . }}-secrets
  labels:
    {{- include "db-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.auth.existingSecret }}
  {{- $secretName := printf "%s-secrets" (include "db-monitor.fullname" .) }}
  {{- $jwtSecret := .Values.auth.jwtSecret }}
  {{- if not $jwtSecret }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existing (hasKey $existing "data") (hasKey $existing.data "JWT_SECRET") }}
  {{- $jwtSecret = index $existing.data "JWT_SECRET" | b64dec }}
  {{- end }}
  {{- end }}
  JWT_SECRET: {{ $jwtSecret | default (randAlphaNum 64) | quote }}
  {{- if .Values.auth.jwtSecretNext }}
  JWT_SECRET_NEXT: {{ .Values.auth.jwtSecretNext | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.database.existingSecret }}
  {{- if .Values.database.password }}
  POSTGRES_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:%d/%s" .Values.database.user .Values.database.password .Values.database.host (int .Values.database.port) .Values.database.name | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.kafka.tls.enabled .Values.kafka.tls.password }}
  KAFKA_SSL_PASSWORD: {{ .Values.kafka.tls.password | quote }}
  {{- end }}
