apiVersion: v1
kind: Secret
metadata:
  name: {{ include "db-monitor.fullname" . }}-secrets
  labels:
    {{- include "db-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.jwtSecret }}
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.auth.jwtSecretNext }}
  JWT_SECRET_NEXT: {{ .Values.auth.jwtSecretNext | quote }}
  {{- end }}
  {{- if .Values.database.password }}
  POSTGRES_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:%d/%s" .Values.database.user .Values.database.password .Values.database.host (int .Values.database.port) .Values.database.name | quote }}
  {{- end }}
  {{- if and .Values.kafka.tls.enabled .Values.kafka.tls.password }}
  KAFKA_SSL_PASSWORD: {{ .Values.kafka.tls.password | quote }}
  {{- end }}
