{{- if .Values.monitoring.serviceMonitor.enabled }}
{{- $sm := .Values.monitoring.serviceMonitor }}
{{- range $role := list "api" "consumer" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "db-monitor.fullname" $ }}-{{ $role }}
  labels:
    {{- include "db-monitor.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "db-monitor.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
{{- end }}
{{- end }}
