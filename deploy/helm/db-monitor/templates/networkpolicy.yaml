{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "db-monitor.fullname" . }}
  labels:
    {{- include "db-monitor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "db-monitor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress/load balancer to the HTTP port
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      from:
        - namespaceSelector: {}
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
      to:
        - namespaceSelector: {}
    # Allow PostgreSQL egress
    - ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
    # Allow Kafka egress
    - ports:
        - port: 9092
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
    # Allow Prometheus scraping
    - ports:
        - port: 8000
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
