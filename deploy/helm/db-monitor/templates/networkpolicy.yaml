{{- if .Values.networkPolicy.enabled }}
{{- range $role := list "api" "consumer" }}
{{- $np := (index $.Values.networkPolicy $role) | default dict }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "db-monitor.fullname" $ }}-{{ $role }}
  labels:
    {{- include "db-monitor.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  podSelector:
    matchLabels:
      {{- include "db-monitor.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if eq $role "api" }}
    # Client traffic from ingress controllers and in-cluster callers.
    - ports:
        - port: {{ $.Values.service.port }}
          protocol: TCP
      from:
        - namespaceSelector: {}
    {{- end }}
    # Prometheus scraping is the only inbound traffic a consumer needs.
    - ports:
        - port: {{ $.Values.service.port }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
      to:
        - namespaceSelector: {}
    # PostgreSQL (both roles touch the monitor database)
    - ports:
        - port: {{ $.Values.database.port }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
    {{- if eq $role "consumer" }}
    # Broker (only the consumer connects to Kafka/RabbitMQ)
    - ports:
        - port: 9092
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
