{{- range $role := list "api" "consumer" }}
{{- $component := (index $.Values $role) | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "db-monitor.fullname" $ }}-{{ $role }}
  labels:
    {{- include "db-monitor.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ $component.replicaCount }}
  selector:
    matchLabels:
      {{- include "db-monitor.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "db-monitor.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "db-monitor.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "db-monitor.container" (dict "root" $ "role" $role) | nindent 8 }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and $.Values.retention.archiveBeforeDelete $.Values.persistence.enabled (eq $role "consumer") }}
        - name: archive
          persistentVolumeClaim:
            claimName: {{ include "db-monitor.fullname" $ }}-archive
        {{- end }}
        {{- with $.Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
