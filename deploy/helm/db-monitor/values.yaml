# Default values for db-monitor.
# This is a YAML-formatted file.

# -- Override the name of the chart
nameOverride: ""
# -- Override the fully qualified app name
fullnameOverride: ""

image:
  # -- Container image repository
  repository: ghcr.io/jobm/db-monitor
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (defaults to Chart appVersion)
  tag: ""

# -- Image pull secrets
imagePullSecrets: []
# -- Service account configuration
serviceAccount:
  create: true
  name: ""
  # -- Annotations for the shared ServiceAccount
  annotations: {}

# ── Workloads (ADR-007) ──────────────────────────────────────────────
#
# The chart runs the same image as two Deployments with different
# responsibilities. Each pod gets SERVICE_ROLE injected explicitly and the
# process only starts the tasks it owns:
#
#   api      — HTTP/WebSocket clients and the audit-log writer; no consumers
#   consumer — broker consumers, retention, partition maintenance; no clients
#
# Scale the consumer up to the topic partition count; replicas beyond that
# stay idle.

api:
  # -- Number of API replicas
  replicaCount: 2
  # -- API resource requests and limits
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  # -- API Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # -- API Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

consumer:
  # -- Number of consumer replicas (bounded by the topic partition count)
  replicaCount: 2
  # -- Consumer resource requests and limits
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  # -- Consumer Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # -- Consumer Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # -- Enable batch processing
  batchEnabled: true
  # -- Batch size for consumer writes
  batchSize: 100
  # -- Enable bulk write ingestion path
  bulkWriteEnabled: true
  # -- Enable DLQ persistence
  dlqEnabled: true
  # -- Readiness threshold for stale commits (seconds)
  readinessMaxCommitAgeSeconds: 300
  # -- Readiness threshold for lag backlog
  readinessMaxConsumerLag: 1000
  # -- Readiness threshold for pending DLQ rows
  readinessMaxDlqMessages: 0

# -- Pod annotations
podAnnotations: {}
# -- Pod labels
podLabels: {}

# -- Pod security context
podSecurityContext:
  fsGroup: 1001

# -- Container security context (non-root, read-only rootfs)
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false

# -- Service configuration
service:
  type: ClusterIP
  port: 8000

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: db-monitor.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - db-monitor
          topologyKey: kubernetes.io/hostname

# -- Topology spread constraints
topologySpreadConstraints: []

# ── Application configuration ────────────────────────────────────────

app:
  # -- Environment mode: development or production
  env: production
  # -- Schema handling: apply, validate, or skip
  schemaMode: validate
  # -- Allow one-time admin bootstrap
  allowBootstrap: false

# ── Database configuration ───────────────────────────────────────────

database:
  # -- PostgreSQL host
  host: postgres-monitor
  # -- PostgreSQL port
  port: 5432
  # -- PostgreSQL database name
  name: postgres
  # -- PostgreSQL user
  user: postgres
  # -- PostgreSQL password (use existingSecret for production)
  password: ""
  # -- Name of existing secret containing postgres-url key
  existingSecret: ""
  # -- Database pool size
  poolSize: 10
  # -- Database max overflow connections
  maxOverflow: 20
  # -- Pool timeout in seconds
  poolTimeoutSeconds: 30
  # -- Pool recycle interval in seconds
  poolRecycleSeconds: 1800
  # -- Validate pooled connections before use
  poolPrePing: true

# ── Message broker configuration ─────────────────────────────────────

broker:
  # -- Broker type: kafka or rabbitmq
  kind: kafka

# -- Kafka configuration (when broker.kind is kafka)
kafka:
  # -- Kafka bootstrap servers
  broker: kafka:9092
  # -- Comma-separated topic list (overrides manifest-derived topics)
  topics: ""
  # -- Consumer group ID
  consumerGroup: fastapi-consumer-group
  # -- Security protocol: PLAINTEXT, SSL, or SASL_SSL
  securityProtocol: PLAINTEXT
  # -- TLS configuration (use existingSecret for certs)
  tls:
    enabled: false
    existingSecret: ""
    caFile: ""
    certFile: ""
    keyFile: ""
    password: ""
  # -- Number of partitions per Kafka topic.
  #   Benchmark results show that with 1 partition, throughput plateaus at
  #   ~400-500 ev/s regardless of injection rate. Production deployments
  #   should set this to at least 6 to enable consumer parallelism.
  #   The pre-install Helm Job will create/alter topics to match this count.
  #   Only topics listed in kafka.topicNames are affected.
  topicPartitionCount: 1
  # -- Replication factor for topics created by the pre-install Job.
  #   Use 1 for single-node/kraft, 3 for production Kafka clusters.
  replicationFactor: 1
  # -- Explicit list of topic names to create/validate during install.
  #   Required when partitionCount > 1 and you are not using an external
  #   topic-provisioning tool. Example:
  #     topicNames:
  #       - orderdb.public.orders
  #       - orderdb.public.customers
  #   Note: The pre-install Job connects via PLAINTEXT protocol and does
  #   not handle SSL/SASL auth. In clusters requiring auth, manage topics
  #   externally (e.g., via Strimzi KafkaTopic CRDs or the Kafka CLI with
  #   appropriate auth flags).
  topicNames: []

# -- Multi-cluster configuration (JSON arrays)
clusters:
  kafkaClusters: ""
  brokerClusters: ""

# -- RabbitMQ configuration (when broker.kind is rabbitmq)
rabbitmq:
  url: amqp://guest:guest@localhost/
  queues: ""
  prefetchCount: 100
  dlqQueue: db-monitor-dlq

# ── Auth configuration ───────────────────────────────────────────────

auth:
  # -- JWT secret. When empty (and no existingSecret is set), the chart
  #   generates one on first install and reuses it on upgrade. Set
  #   explicitly (or use existingSecret) to manage rotation yourself.
  jwtSecret: ""
  # -- JWT rotation secret
  jwtSecretNext: ""
  # -- Name of existing secret containing jwt-secret key
  existingSecret: ""
  # -- JWT algorithm
  jwtAlgorithm: HS256
  # -- Access token TTL in minutes
  accessTokenTtlMinutes: 15
  # -- WebSocket session token TTL in seconds
  wsSessionTokenTtlSeconds: 60
  # -- Default API key lifetime in days
  apiKeyDefaultTtlDays: 90

# ── Ingestion quota configuration ────────────────────────────────────

ingestionQuota:
  enabled: false
  windowSeconds: 60
  sourceDefaultEventsPerWindow: 0
  sourceQuotas: "{}"
  tenantDefaultEventsPerWindow: 0
  tenantQuotas: "{}"
  mode: throttle
  maxThrottleSeconds: 5.0

# ── Retention configuration ──────────────────────────────────────────

retention:
  cleanupEnabled: true
  cleanupIntervalSeconds: 3600
  cleanupBatchSize: 1000
  cleanupMaxBatchesPerTable: 10
  archiveBeforeDelete: false
  archiveDir: /tmp/retention-archive
  eventRetentionDays: 90
  columnChangesRetentionDays: 90
  deadLetterRetentionDays: 30
  apiAuditLogRetentionDays: 30

# ── WebSocket configuration ──────────────────────────────────────────

websocket:
  # -- Enable cross-replica backplane for WebSocket fanout
  backplaneEnabled: true
  # -- Backend type: postgres (LISTEN/NOTIFY) or redis (Pub/Sub)
  #   For high-scale deployments (2000+ ev/s), use ``redis`` with
  #   websocket.redisUrl configured.
  backplaneBackend: postgres
  # -- Postgres NOTIFY or Redis Pub/Sub channel name
  backplaneChannel: db_monitor_ws
  # -- Redis connection URL (required when backplaneBackend is redis)
  #   Example: redis://redis:6379/0
  redisUrl: ""
  # -- Prefix for Redis Pub/Sub channel names
  redisChannelPrefix: db_monitor

# ── Webhook configuration ────────────────────────────────────────────

webhooks:
  urls: ""
  timeoutSeconds: 10
  maxRetries: 3
  retryBackoffSeconds: 2.0
  circuitBreakerThreshold: 5
  circuitBreakerRecoverySeconds: 60
  sharedSecret: ""

# ── Tracing configuration ────────────────────────────────────────────

tracing:
  enabled: false
  exporter: console
  otlpEndpoint: ""
  otlpHeaders: ""

# ── Persistence ──────────────────────────────────────────────────────

persistence:
  enabled: true
  # -- Storage class for retention archive PVC
  storageClass: ""
  # -- Access mode
  accessMode: ReadWriteOnce
  # -- Size of archive volume
  size: 10Gi

# ── Monitoring ───────────────────────────────────────────────────────

monitoring:
  # -- Create a Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# ── Network policies ─────────────────────────────────────────────────

networkPolicy:
  enabled: false
  api:
    # -- Additional API egress rules (database egress is auto-generated)
    extraEgress: []
  consumer:
    # -- Additional consumer egress rules (database and broker egress are
    #   auto-generated)
    extraEgress: []

# ── Extra environment variables ──────────────────────────────────────

extraEnv: []
# - name: CUSTOM_EVENT_PROCESSORS
#   value: "my_project.processors:add_summary"

# -- Extra volumes
extraVolumes: []
# -- Extra volume mounts
extraVolumeMounts: []
