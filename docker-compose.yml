services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9093:9093"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  postgres-order:
    image: postgres:15
    profiles:
      - sandbox
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./examples/sandbox/init/order.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"

  postgres-catalog:
    image: postgres:15
    profiles:
      - sandbox
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./examples/sandbox/init/catalog.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5435:5432"

  postgres-shipping:
    image: postgres:15
    profiles:
      - sandbox
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./examples/sandbox/init/shipping.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5436:5432"

  postgres-monitor:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"

  connect:
    image: debezium/connect:2.5
    profiles:
      - sandbox
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_PLUGIN_PATH: /kafka/connect,/debezium-connector-postgres
    depends_on:
      - kafka
      - postgres-order
      - postgres-catalog
      - postgres-shipping
      - postgres-monitor
    volumes:
      - ./connectors:/connectors

  monitor-server:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["sh", "/app/container-entrypoint.sh"]
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_SCHEMA_MODE: ${DB_SCHEMA_MODE:-validate}
      APP_SHUTDOWN_TIMEOUT_SECONDS: ${APP_SHUTDOWN_TIMEOUT_SECONDS:-45}
      ALLOW_BOOTSTRAP: ${ALLOW_BOOTSTRAP:-false}
      POSTGRES_URL_FILE: /run/secrets/monitor_postgres_url
      KAFKA_BROKER: kafka:9092
      JWT_SECRET_FILE: /run/secrets/monitor_jwt_secret
      JWT_SECRET_NEXT_FILE: /run/secrets/monitor_jwt_secret_next
    depends_on:
      - kafka
      - postgres-monitor
    ports:
      - "8000:8000"
    volumes:
      - ./connectors:/connectors:ro
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s

  connector-registrar:
    build:
      context: .
      dockerfile: Dockerfile.register
    profiles:
      - sandbox
    depends_on:
      - connect
    restart: on-failure
    environment:
      - MAX_RETRIES=50
      - RETRY_DELAY=10
    volumes:
      - ./connectors:/connectors:ro

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - monitor-server

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/:/etc/alertmanager/
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9094:9093"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
